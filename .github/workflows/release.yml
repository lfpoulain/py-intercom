# Every push and pull request: lint, test and build the Windows installer.
# Every push to main: also publish them as a GitHub release.
name: Build & release

on:
  push:
    branches: [main]
    # A documentation-only change does not publish a new version.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Compute version
        id: version
        # Major.minor come from src/py_intercom/__init__.py, the patch is the build number.
        run: |
          $base = python -c "import sys; sys.path.insert(0, 'src'); import py_intercom as p; print('.'.join(p.__version__.split('.')[:2]))"
          "version=$base.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: ./scripts/build_exe.ps1 -Python python -Version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: py-intercom-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: py-intercom-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          latest="https://github.com/${GH_REPO}/releases/latest/download"
          cat > notes.md <<NOTES
          ## Télécharger

          - [py-intercom-setup.exe](${latest}/py-intercom-setup.exe) : l'installateur, identique pour la Régie et les postes.

          Lancer l'installateur, puis ouvrir py-intercom. Au premier lancement, choisir ce que fait ce PC (Régie ou Poste) ; maintenir Maj au lancement pour revoir ce choix. Le menu Démarrer propose aussi des raccourcis « py-intercom Régie » et « py-intercom Poste ».

          Installer une nouvelle version par-dessus l'ancienne la met à jour ; les réglages et presets (dossier \`py-intercom\` de l'utilisateur) sont conservés. Si Windows SmartScreen s'affiche, choisir « Informations complémentaires » puis « Exécuter quand même ».
          NOTES
          gh release create "v${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "py-intercom ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            --latest
