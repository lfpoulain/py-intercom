name: Build Windows Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    # Keep the runner aligned with the explicitly pinned VS 2022 CMake
    # generator used by the verified native build recipe.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build verified Opus runtime
        # The native recipe is qualified with the Windows PowerShell 5.1
        # environment shipped on both operator workstations and hosted runners.
        shell: powershell
        run: |
          try {
            & '.\exe scripts\build_opus.ps1' -Clean
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Verified Opus build failed::$message"
            throw
          }

      - name: Validate sources
        shell: pwsh
        run: |
          python -m compileall -q src run_client.py run_server.py
          python -m pytest tests -q

      - name: Build executables
        shell: pwsh
        run: |
          & '.\exe scripts\build_exe.ps1' -Clean

      - name: Prepare release metadata
        id: meta
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $branchSlug = $branch -replace '[^A-Za-z0-9._-]', '-'
          $sha = "${{ github.sha }}".Substring(0, 7)
          $tag = "build-$branchSlug-${{ github.run_number }}-$sha"
          $name = "Windows build $branch #${{ github.run_number }} ($sha)"
          if ($branch -in @('main', 'master')) {
            $prerelease = 'false'
          } else {
            $prerelease = 'true'
          }
          $zipName = "py-intercom-$tag-windows.zip"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Package executables
        shell: pwsh
        run: |
          $releaseFiles = @(
            '.\dist\client.exe',
            '.\dist\server.exe',
            '.\dist\LICENSE',
            '.\dist\THIRD_PARTY_NOTICES.md',
            '.\dist\OPUS_LICENSE.txt',
            '.\dist\OPUS_BUILD_INFO.json',
            '.\dist\README.md'
          )
          Compress-Archive -Path $releaseFiles -DestinationPath (Join-Path '.\dist' '${{ steps.meta.outputs.zip_name }}') -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tag }}
          path: |
            dist/client.exe
            dist/server.exe
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/OPUS_LICENSE.txt
            dist/OPUS_BUILD_INFO.json
            dist/README.md
            dist/${{ steps.meta.outputs.zip_name }}

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/client.exe
            dist/server.exe
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/OPUS_LICENSE.txt
            dist/OPUS_BUILD_INFO.json
            dist/${{ steps.meta.outputs.zip_name }}
