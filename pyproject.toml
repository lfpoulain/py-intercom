[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-intercom"
dynamic = ["version"]
description = "Low-latency desktop intercom for live production teams"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-NC-ND-4.0"
dependencies = [
    "loguru>=0.7,<1",
    "numpy>=2,<3",
    "opuslib>=3,<4",
    "pynput>=1.7,<2",
    "PySide6>=6.8,<7",
    "sounddevice>=0.5,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "py_intercom.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
py_intercom = ["img/*.ico", "img/*.png"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "I",               # import order
    "B",               # bugbear
    "UP",              # modern syntax for Python 3.11+
    "S110", "S112",    # no exception silently swallowed
]

[tool.ruff.lint.per-file-ignores]
# Entry points and conftest must prepare the DLL search path before importing.
"run_*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# Tests may swallow exceptions on purpose to assert on side effects.
"tests/**" = ["S110", "S112", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
